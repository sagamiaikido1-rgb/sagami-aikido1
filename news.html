<script>
  // ブラウザのスクロール位置自動復元を無効化する
  // （URLにアンカー（#〜）が含まれる場合は、そのセクションへの移動を優先し、強制的な先頭スクロールは行わない）
  if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
  }
  if (!window.location.hash) {
    window.scrollTo(0, 0);
  }
</script>

    .nav-dropdown{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:6px;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,0.35);opacity:0;visibility:hidden;transform:translateX(-50%) translateY(4px);transition:all .18s ease;z-index:1100;}
    .nav-group:hover .nav-dropdown,.nav-group.open .nav-dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
    .nav-dropdown a{display:block;padding:8px 12px;border-radius:6px;font-size:12px;white-space:nowrap;}
    .nav-dropdown a::after{display:none;}
    .nav-dropdown a:hover{background:rgba(255,255,255,0.1);}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;}
    .hamburger span{display:block;width:24px;height:2px;background:var(--white);}

    .mobile-nav-acc{border-bottom:1px solid rgba(255,255,255,0.08);}.mobile-nav-acc-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;color:rgba(255,255,255,0.85);font-size:14px;background:none;border:none;text-align:left;cursor:pointer;font-family:inherit;}.mobile-nav-acc-btn::after{content:'▾';font-size:11px;color:rgba(255,255,255,0.45);transition:transform .2s;}.mobile-nav-acc.open .mobile-nav-acc-btn::after{transform:rotate(180deg);}.mobile-nav-acc-panel{max-height:0;overflow:hidden;transition:max-height .25s ease;background:rgba(0,0,0,0.18);}.mobile-nav-acc.open .mobile-nav-acc-panel{max-height:220px;}.mobile-nav-acc-panel a{padding:12px 24px 12px 40px;font-size:13px;color:rgba(255,255,255,0.7);border-bottom:1px solid rgba(255,255,255,0.06);}.mobile-nav-acc-panel a:last-child{border-bottom:none;}
    .mobile-nav.open{display:block;}
    .page-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 60%,#1a3a5c 100%);padding:64px 24px 48px;text-align:center;border-bottom:none;}
    .page-label{font-size:11px;letter-spacing:4px;color:var(--gold-light);text-transform:uppercase;margin-bottom:10px;}

    .news-item{display:flex;align-items:flex-start;gap:16px;padding:18px 16px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--white);transition:box-shadow .3s ease,transform .3s ease;}

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, orderBy, query }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBfhzD-KOcyAneUEHDeAYx1WB7Tcefc1So",
    authDomain: "sagami-aikido-b5961.firebaseapp.com",
    projectId: "sagami-aikido-b5961",
    storageBucket: "sagami-aikido-b5961.firebasestorage.app",
    messagingSenderId: "770248355445",
    appId: "1:770248355445:web:3104563942dfed363d923c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const TAG_CLASS = {'新着':'tag-new','行事':'tag-event','お知らせ':'tag-info'};

  async function loadNews(){
    const container = document.getElementById('newsContainer');
    try{
      const q = query(collection(db,'news'), orderBy('date','desc'));
      const snap = await getDocs(q);
      const items = snap.docs.map(d=>d.data());

      if(!items.length){
        container.innerHTML='<div class="loading">お知らせはありません</div>';
        return;
      }

      // 年ごとにグループ化
      const byYear = {};
      items.forEach(item=>{
        const year = item.date ? item.date.split('.')[0] : '不明';
        if(!byYear[year]) byYear[year]=[];
        byYear[year].push(item);
      });

      const years = Object.keys(byYear).sort((a,b)=>b-a);
      container.innerHTML = years.map(year=>`
        <div class="year-section">
          <h2 class="year-heading">${year}年</h2>
          ${byYear[year].map(n=>{
            const tagClass = TAG_CLASS[n.category]||'tag-info';
            const linkHtml = n.url
              ? `<a href="${n.url}" target="_blank" rel="noopener"
                   style="display:inline-block;margin-top:6px;font-size:12px;
                          color:var(--gold-light);text-decoration:none;
                          border:1px solid var(--gold-light);padding:2px 12px;border-radius:999px;">
                   🔗 詳細を見る</a>` : '';
            return `<div class="news-item">
              <span class="news-date">${n.date}</span>
              <span class="news-tag ${tagClass}">${n.category}</span>
              <span class="news-text">${n.text}${linkHtml ? '<br>'+linkHtml : ''}</span>
            </div>`;
          }).join('')}
        </div>
      `).join('');
    }catch(e){
      container.innerHTML='<div class="loading">読み込みに失敗しました</div>';
    }
  }

  loadNews();
</script>

<script>
  // モバイルメニュー：リンクをタップしたら自動で閉じる
  document.querySelectorAll('.mobile-nav a').forEach(function(a){
    a.addEventListener('click', function(){
      var menu = document.querySelector('.mobile-nav');
      if(menu) menu.classList.remove('open');
    });
  });

  // PC用ドロップダウン：クリック（タップ）で開閉
  // iPad Safari等、:hoverが効かないタッチデバイスでも確実に動作するようにする
  document.querySelectorAll('nav .nav-group > .nav-parent').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var group = btn.parentElement;
      var wasOpen = group.classList.contains('open');
      document.querySelectorAll('nav .nav-group.open').forEach(function(g){
        if(g !== group) g.classList.remove('open');
      });
      group.classList.toggle('open', !wasOpen);
    });
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('nav .nav-group.open').forEach(function(g){
      g.classList.remove('open');
    });
  });
  document.querySelectorAll('.nav-dropdown a').forEach(function(a){
    a.addEventListener('click', function(){
      document.querySelectorAll('nav .nav-group.open').forEach(function(g){
        g.classList.remove('open');
      });
    });
  });
</script>
